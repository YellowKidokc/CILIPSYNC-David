<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POF 2828 — Research Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #050911;
    --panel: #090f1d;
    --panel-soft: #0d1424;
    --panel-hover: #121b2f;
    --border: #1a243a;
    --muted: #6f7f9f;
    --text: #d5def1;
    --accent: #23a3ff;
    --accent-soft: rgba(35, 163, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #0a1426 0%, var(--bg) 45%);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
  }

  .sidebar {
    background: linear-gradient(180deg, #080f1e 0%, #070d19 100%);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .brand {
    border: 1px solid var(--border);
    background: var(--panel-soft);
    border-radius: 10px;
    padding: 12px;
  }

  .brand-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 1.2px;
    color: #7ec7ff;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .nav-group-title {
    font: 10px 'IBM Plex Mono', monospace;
    color: #7b8cad;
    letter-spacing: 1.5px;
    margin: 2px 8px;
    text-transform: uppercase;
  }

  .nav-item {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: #aab7d3;
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-item.active {
    background: var(--accent-soft);
    border-color: #1d4c71;
    color: #9dd8ff;
  }

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(9, 15, 29, 0.82);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-wrap h1 {
    font-size: 15px;
    font-weight: 600;
  }

  .title-wrap p {
    font-size: 12px;
    color: var(--muted);
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
    width: min(380px, 55%);
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #627393;
  }

  .search-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0b1322;
    color: var(--text);
    padding: 9px 12px 9px 34px;
    font-size: 13px;
    outline: none;
  }

  .search-input:focus {
    border-color: #275b86;
    box-shadow: 0 0 0 3px rgba(35, 163, 255, 0.12);
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .tab {
    border: 1px solid transparent;
    background: transparent;
    color: #8294b7;
    font: 11px 'IBM Plex Mono', monospace;
    letter-spacing: 1px;
    padding: 8px 10px;
    border-radius: 8px;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab:hover { background: #0f1829; }

  .tab.active {
    background: var(--accent-soft);
    border-color: #22577f;
    color: #92d3ff;
  }

  .content {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .link-card {
    background: linear-gradient(180deg, #0c1423, #0b1220);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    transition: 0.18s ease;
    cursor: pointer;
  }

  .link-card:hover {
    border-color: #2a5f89;
    background: linear-gradient(180deg, #0d1729, #0b1324);
    transform: translateY(-1px);
  }

  .link-title {
    font-size: 13px;
    line-height: 1.45;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .link-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .link-domain {
    color: #7890b6;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .link-category {
    border-radius: 999px;
    font-size: 10px;
    padding: 3px 8px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }

  .category-theology { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }
  .category-physics { background: rgba(96, 165, 250, 0.22); color: #93c5fd; }
  .category-philosophy { background: rgba(244, 114, 182, 0.2); color: #f9a8d4; }
  .category-science { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; }
  .category-psychology { background: rgba(251, 191, 36, 0.2); color: #fde68a; }
  .category-culture { background: rgba(248, 113, 113, 0.2); color: #fca5a5; }
  .category-general { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

  .no-results {
    text-align: center;
    padding: 70px 20px;
    color: #7b8ead;
    font-size: 13px;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .search-wrap { width: 100%; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">ClipSync</div>
      <div class="brand-sub">Research Workspace</div>
    </div>

    <div>
      <div class="nav-group-title">Library</div>
      <button class="nav-item active">Research Links <span id="sidebarTotal">0</span></button>
      <button class="nav-item">Starred <span>0</span></button>
      <button class="nav-item">Recent <span>0</span></button>
    </div>

    <div>
      <div class="nav-group-title">Tools</div>
      <button class="nav-item">Deep Research</button>
      <button class="nav-item">Web Crawling</button>
      <button class="nav-item">MCP Server</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title-wrap">
        <h1>POF 2828 — Research Links</h1>
        <p>Curated link board with category filters</p>
      </div>
      <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="4"/><path d="M8.5 8.5L12 12"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search links, domains, or category...">
      </div>
    </header>

    <div class="tabs" id="tabsContainer">
      <button class="tab active" data-category="all">ALL <span class="tab-count"></span></button>
    </div>

    <section class="content">
      <div class="links-grid" id="linksGrid"></div>
      <div class="no-results" id="noResults" style="display:none;">No links found</div>
    </section>
  </main>
</div>

<script>
const linksData = [
  {"domain":"biblestudytools.com","title":"What Is the Study of Hamartiology in Theology? - Topical Studies - Bible Study Tools","url":"https://biblestudytools.com","category":"Theology"},
  {"domain":"digitalcommons.andrews.edu","title":"Evil, Ontology, and Scripture: A Diachronic Analysis of Augustine","url":"https://digitalcommons.andrews.edu","category":"Theology"},
  {"domain":"reddit.com","title":"Manichaean influence discussions and source roundup","url":"https://reddit.com","category":"Theology"},
  {"domain":"scribd.com","title":"Kalki Avatar: The End of Kali Yuga | PDF | Hindu Deities | Indian Religions - Scribd","url":"https://scribd.com","category":"General"},
  {"domain":"en.wikipedia.org","title":"Kalki - Wikipedia","url":"https://en.wikipedia.org","category":"General"},
  {"domain":"youtube.com","title":"PRALAYA: The Cosmic Reset | Ancient Hindu Science vs Modern Science - YouTube","url":"https://youtube.com","category":"Science"},
  {"domain":"decodehindumythology.blogspot.com","title":"Pralaya - The End of Days - Decode Hindu Mythology","url":"https://decodehindumythology.blogspot.com","category":"General"},
  {"domain":"en.wikipedia.org","title":"Decline of the Dharma - Wikipedia","url":"https://en.wikipedia.org","category":"General"},
  {"domain":"originalbuddhas.com","title":"Maitreya Buddha | The Future Buddha | Ajita - OriginalBuddhas","url":"https://originalbuddhas.com","category":"General"},
  {"domain":"en.wikipedia.org","title":"Buddhist eschatology - Wikipedia","url":"https://en.wikipedia.org","category":"Theology"},
  {"domain":"dharmawheel.net","title":"The Prophecy of the Maitreya Buddha - Dharma Wheel","url":"https://dharmawheel.net","category":"General"},
  {"domain":"wisdomlib.org","title":"Seven suns: Significance and symbolism","url":"https://wisdomlib.org","category":"General"},
  {"domain":"hinduwebsite.com","title":"The Buddha On How The World Will End","url":"https://hinduwebsite.com","category":"General"},
  {"domain":"thequran.love","title":"Comparative Analysis of Abrahamic Resurrection and Dharmic Reincarnation","url":"https://thequran.love","category":"Science"},
  {"domain":"lifestyle.sustainability-directory.com","title":"How Does Faith Shape Environmental Ethics?","url":"https://lifestyle.sustainability-directory.com","category":"Psychology"},
  {"domain":"en.wikipedia.org","title":"Ultimate fate of the universe - Wikipedia","url":"https://en.wikipedia.org","category":"Physics"},
  {"domain":"astronomy.com","title":"The Big Crunch vs. The Big Freeze","url":"https://astronomy.com","category":"Physics"},
  {"domain":"news.cornell.edu","title":"After 33 billion years, universe could end in a big crunch","url":"https://news.cornell.edu","category":"Physics"},
  {"domain":"repository.cam.ac.uk","title":"Existential Risk and Global Catastrophic Risk: A Review","url":"https://repository.cam.ac.uk","category":"General"},
  {"domain":"pmc.ncbi.nlm.nih.gov","title":"Eco-emotions and Psychoterratic Syndromes under Climate Change","url":"https://pmc.ncbi.nlm.nih.gov","category":"Science"},
  {"domain":"zygonjournal.org","title":"Transhumanism as a Secularist Faith","url":"https://zygonjournal.org","category":"Science"},
  {"domain":"acton.org","title":"Jacques Ellul and the Idols of Transhumanism","url":"https://acton.org","category":"General"},
  {"domain":"researchgate.net","title":"A Rapture of the Nerds? Transhumanist Eschatology and Christian Parousia","url":"https://researchgate.net","category":"Theology"},
  {"domain":"christopherbenek.com","title":"The Singularity: Christianity's New Eschatological Hope","url":"https://christopherbenek.com","category":"Theology"},
  {"domain":"scielo.org.mx","title":"Digital Immortality? Mind Uploading and the quest for everlasting life","url":"https://scielo.org.mx","category":"General"},
  {"domain":"youtube.com","title":"Superintelligence | Nick Bostrom | Talks at Google","url":"https://youtube.com","category":"General"}
];

const tabsContainer = document.getElementById('tabsContainer');
const linksGrid = document.getElementById('linksGrid');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const sidebarTotal = document.getElementById('sidebarTotal');

const categories = ['all', ...new Set(linksData.map(link => link.category))];

categories.forEach(cat => {
  if (cat === 'all') {
    const allTab = tabsContainer.querySelector('[data-category="all"]');
    const count = linksData.length;
    allTab.querySelector('.tab-count').textContent = `(${count})`;
    sidebarTotal.textContent = count;
    return;
  }

  const count = linksData.filter(link => link.category === cat).length;
  const tab = document.createElement('button');
  tab.className = 'tab';
  tab.dataset.category = cat;
  tab.innerHTML = `${cat.toUpperCase()} <span class="tab-count">(${count})</span>`;
  tabsContainer.appendChild(tab);
});

let currentCategory = 'all';
let searchQuery = '';

function renderLinks() {
  const filtered = linksData.filter(link => {
    const matchesCategory = currentCategory === 'all' || link.category === currentCategory;
    const matchesSearch = !searchQuery ||
      link.title.toLowerCase().includes(searchQuery) ||
      link.domain.toLowerCase().includes(searchQuery) ||
      link.category.toLowerCase().includes(searchQuery);
    return matchesCategory && matchesSearch;
  });

  linksGrid.innerHTML = '';

  if (filtered.length === 0) {
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';

  filtered.forEach(link => {
    const card = document.createElement('article');
    card.className = 'link-card';
    card.innerHTML = `
      <div class="link-title">${link.title}</div>
      <div class="link-meta">
        <div class="link-domain">${link.domain}</div>
        <div class="link-category category-${link.category.toLowerCase()}">${link.category}</div>
      </div>
    `;
    card.addEventListener('click', () => {
      window.open(link.url, '_blank');
    });
    linksGrid.appendChild(card);
  });
}

tabsContainer.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');

  currentCategory = tab.dataset.category;
  renderLinks();
});

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderLinks();
});

renderLinks();
</script>
</body>
</html>
